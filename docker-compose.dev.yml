version: "3.9"

services:
  nginx:
    volumes:
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

  php:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  node:
    image: node:20
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm ci && npm run dev"
    ports:
      - "5173:5173"
    networks:
      - barasira

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    networks:
      - barasira

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    networks:
      - barasira

volumes:
  node_modules:

networks:
  barasira:

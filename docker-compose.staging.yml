services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: staging
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?SUPERADMIN_EMAIL is required}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?SUPERADMIN_PASSWORD is required}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-barasira}
      DB_USERNAME: ${DB_USERNAME:-barasira}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      # Brevo SMTP : le login et la clé SMTP sont des secrets Coolify.
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is required}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Barasira Staging}
      MAIL_CONTACT_ADDRESS: ${MAIL_CONTACT_ADDRESS:-contact@barasira.com}
    # Le proxy Coolify accède au port 80 via le réseau Docker. Ne pas publier
    # ce port sur l'hôte, car Coolify utilise déjà les ports publics 80 et 443.
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - barasira

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-barasira}
      MYSQL_USER: ${DB_USERNAME:-barasira}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - staging_dbdata:/var/lib/mysql
    networks:
      - barasira

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - barasira

networks:
  barasira:

volumes:
  staging_dbdata:

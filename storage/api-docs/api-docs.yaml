          $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionUpdateRequest'
      responses:
        200:
          description: Updated
      security:
        -
          sanctum: []
  '/api/missions/{id}/applications':
    post:
      tags:
        - 'Mission applications'
      description: 'Permet à un prestataire de postuler à une mission disponible avec un tarif horaire ou un forfait global. Une candidature est refusée si elle chevauche une autre mission ou candidature active sur le même créneau.'
      operationId: missionApplications.store
      parameters:
        -
          $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionApplicationRequest'
      responses:
        201:
          description: 'Candidature créée et client notifié'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionApplicationResponse'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationError'
      security:
        -
          sanctum: []
  '/api/missions/{id}/applications/{application}/accept':
    post:
      tags:
        - 'Mission applications'
      description: 'Le client propriétaire sélectionne une candidature. La mission passe en cours, les autres candidatures sont refusées et le prestataire retenu reçoit une notification interne, un e-mail et un message WhatsApp.'
      operationId: missionApplications.accept
      parameters:
        -
          $ref: '#/components/parameters/Id'
        -
          name: application
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        200:
          description: 'Candidature acceptée et mission attribuée'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationError'
      security:
        -
          sanctum: []
  /api/missions/generate-with-ai:

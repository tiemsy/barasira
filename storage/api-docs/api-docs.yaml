          sanctum: []
    put:
      tags:
        - Users
      operationId: users.updatePut
      parameters:
        -
          $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        200:
          description: Updated
      security:
        -
          sanctum: []
    post:
      tags:
        - Users
      operationId: users.updatePost
      parameters:
        -
          $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        200:
          description: Updated
        422:
          $ref: '#/components/responses/ValidationError'
      security:
        -
          sanctum: []
    patch:
      tags:
        - Users
      operationId: users.updatePatch
      parameters:
        -
          $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:

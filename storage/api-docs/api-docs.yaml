          sanctum: []
  '/api/messages/conversation/{user}':
    get:
      tags:
        - Messages
      operationId: messages.conversation
      parameters:
        -
          name: user
          in: path
          required: true
          schema:
            type: integer
        -
          name: mission_id
          in: query
          schema:
            type: integer
            nullable: true
      responses:
        200:
          description: Conversation
      security:
        -
          sanctum: []
  /api/reviews:
    post:
      tags:
        - Reviews
      operationId: reviews.store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'

  /api/missions:
    get:
      tags:
        - Missions
      operationId: missions.index
      responses:
        200:
          description: Missions
      security:
        -
          sanctum: []
    post:
      tags:
        - Missions
      operationId: missions.store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionRequest'

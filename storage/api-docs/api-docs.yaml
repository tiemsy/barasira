      operationId: resumes.show
      parameters:
        -
          $ref: '#/components/parameters/Id'
      responses:
        200:
          description: 'Not implemented'
      security: []
    put:
      tags:
        - Resumes
      operationId: resumes.updatePut
      parameters:
        -
          $ref: '#/components/parameters/Id'
      responses:
        200:

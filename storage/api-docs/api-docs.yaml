      operationId: services.updatePut
      parameters:
        -
          $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
      responses:
        200:
          description: Updated
      security:
        -
          sanctum: []
    delete:
      tags:
        - Services
      operationId: services.destroy
      parameters:
        -
          $ref: '#/components/parameters/Id'
      responses:
        204:
          description: Deleted
      security:
        -
          sanctum: []
    patch:
      tags:
        - Services
      operationId: services.updatePatch
      parameters:
        -
          $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:

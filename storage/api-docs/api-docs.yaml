openapi: 3.0.0
info:
  title: 'Bara Sira API'
  description: 'Contrat de l’API BaraSira au 30 juillet 2026 : authentification web ou Bearer, utilisateurs, services, missions, candidatures avec tarification horaire ou globale, messagerie, avis, IA, CV, portfolio et paiements. Les routes protégées exigent aussi une adresse e-mail vérifiée.'
  contact:
    name: 'Équipe BaraSira'
    email: contact@BaraSira.com
  version: 1.3.0
servers:
  -
    url: 'http://localhost:8080'
    description: 'Serveur principal API'
paths:
  /api/auth/google/redirect:
    get:
      tags:
        - Auth
      summary: 'L5-Swagger endpoint annotations.'
      description: "Controllers stay focused on HTTP behaviour; this class is the single source\nfor operation metadata and references the shared schemas in Schemas.php."
      operationId: google.redirect
      parameters:
        -
          name: intent
          in: query
          description: 'SSO entry point'
          schema:
            type: string
            default: login
            enum:
              - login
              - register
      responses:
        302:
          description: 'Redirect to Google'
      security: []
  /api/auth/google/callback:
    get:
      tags:
        - Auth
      description: 'Authenticates an existing account by Google email. Unknown users are not created and are redirected to registration.'
      operationId: google.callback
      parameters:
        -
          name: code
          in: query
          schema:
            type: string
        -
          name: state
          in: query
          schema:
            type: string
      responses:
        302:
          description: 'Dashboard or registration redirect'
      security: []
  /api/login:
    post:
      tags:
        - Auth
      operationId: auth.login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        422:
          $ref: '#/components/responses/ValidationError'
      security: []
  /api/register:
    post:
      tags:
        - Auth
      operationId: auth.register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        201:
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        422:
          $ref: '#/components/responses/ValidationError'
      security: []
  /api/logout:
    post:
      tags:
        - Auth
      operationId: auth.logout
      responses:
        200:
          description: 'Logged out'
        401:
          $ref: '#/components/responses/Unauthenticated'
      security:
        -
          sanctum: []
  /api/me:
    get:
      tags:
        - Auth
      operationId: auth.me
      responses:
        200:
          description: 'Current user'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthenticated'
      security:
        -
          sanctum: []
  /api/users:
    get:
      tags:
        - Users
      operationId: users.index
      responses:
        200:
          description: Users
        403:
          $ref: '#/components/responses/Forbidden'
      security:
        -
          sanctum: []
  '/api/users/{id}':
    get:
      tags:
        - Users
      operationId: users.show
      parameters:
        -
          $ref: '#/components/parameters/Id'
      responses:
        200:
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        404:

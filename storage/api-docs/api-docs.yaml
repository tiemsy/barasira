      operationId: categories.updatePatch
      parameters:
        -
          $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCategoryRequest'
      responses:
        200:
          description: Updated
      security: []
  /api/services:
    get:
      tags:
        - Services
      operationId: services.index
      responses:
        200:
          description: Services
      security: []
    post:

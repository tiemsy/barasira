  '/api/missions/{id}/payments':
    post:
      tags:
        - Payments
      description: 'Initialise le paiement d’une mission en cours appartenant au client authentifié. Le montant est le forfait global accepté ou le tarif horaire accepté multiplié par les heures facturables. Ces heures ne peuvent pas être inférieures aux heures initiales. Une à cinq photos de réalisation sont obligatoires.'
      operationId: payments.store
      parameters:
        -
          $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
      responses:
        201:
          description: 'Paiement initialisé'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        403:
          $ref: '#/components/responses/Forbidden'
        409:
          description: 'Mission déjà payée'
        422:
          $ref: '#/components/responses/ValidationError'
        502:
          description: 'Passerelle de paiement indisponible'
      security:
        -
          sanctum: []
  '/api/payments/{id}':
    get:
      tags:
        - Payments
      description: 'Retourne un paiement appartenant au client authentifié.'
      operationId: payments.show
      parameters:
        -
          $ref: '#/components/parameters/Id'
      responses:

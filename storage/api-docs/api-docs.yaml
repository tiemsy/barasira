          sanctum: []
  '/api/payments/mobile/return/{id}':
    get:
      tags:
        - Payments
      description: 'Capture si nécessaire le paiement PayPal puis redirige vers BaraSira://payments/{id}.'
      operationId: payments.mobileReturn
      parameters:
        -
          $ref: '#/components/parameters/Id'
      responses:
        302:
          description: 'Redirection vers l’application mobile'
      security: []
  '/api/payments/mobile/cancel/{id}':
    get:
      tags:
        - Payments
      description: 'Annule un paiement encore en attente puis redirige vers BaraSira://payments/{id}.'
      operationId: payments.mobileCancel
      parameters:
        -
          $ref: '#/components/parameters/Id'
      responses:
        302:
          description: 'Redirection vers l’application mobile'
      security: []
  /api/payments/webhooks/cinetpay:
    get:
      tags:
        - Payments
      operationId: payments.cinetpayPing
      responses:
        204:
          description: 'Webhook availability'
      security: []
    post:
      tags:
        - Payments
      operationId: payments.cinetpayWebhook
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                cpm_trans_id:
                  type: string
              type: object
      responses:
        204:
          description: 'Notification verified'
      security: []
components:
  schemas:
    Schemas:
      type: array
      items:
        type: string
    User:
      properties:
        id:
          type: integer
        slug:
          type: string
          example: aminata-traore
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - client
            - prestataire
            - admin
            - superadmin
        locale:
          type: string
          enum:
            - fr
            - en
            - bm
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        hourly_rate:
          description: 'Tarif horaire de référence du prestataire en FCFA.'
          type: number
          format: float
          nullable: true
        identity_verified_at:
          description: 'Présent lorsqu’une pièce d’identité du prestataire a été validée par l’administration.'
          type: string
          format: date-time
          nullable: true
      type: object
    AuthResponse:
      properties:
        success:
          type: boolean
        message:
          type: string
        redirect:
          type: string
        user:
          $ref: '#/components/schemas/User'
        token:
          description: 'Jeton Sanctum retourné uniquement lorsqu’un device_name est fourni.'
          type: string
          nullable: true
      type: object
    LoginRequest:
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6
        remember:
          type: boolean
        device_name:
          type: string
          maxLength: 100
          nullable: true
      type: object
    RegisterRequest:
      required:
        - first_name
        - last_name
        - phone
        - email
        - password
        - password_confirmation
        - role
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6
        password_confirmation:
          type: string
          format: password
        role:
          type: string
          enum:
            - client
            - prestataire
        device_name:
          type: string
          maxLength: 100
          nullable: true
      type: object
    UserUpdateRequest:
      required:
        - first_name
        - last_name
        - email
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        bio:
          type: string
          maxLength: 2000
          nullable: true
        hourly_rate:
          type: number
          maximum: 99999999.99
          minimum: 0
          nullable: true
        avatar:
          type: string
          format: binary
          nullable: true
        remove_avatar:
          type: boolean
      type: object
    ServiceCategoryRequest:
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 150
        description:
          type: string
          nullable: true
        icon:
          type: string
          maxLength: 255
          nullable: true
      type: object
    ServiceRequest:
      required:
        - service_category_id
        - name
        - description
        - price_min
        - price_max
      properties:
        service_category_id:
          type: integer
        name:
          type: string
          maxLength: 150
        description:
          type: string
        icon:
          type: string
          nullable: true
        price_min:
          type: number
          minimum: 0
        price_max:
          type: number
          minimum: 0
        is_active:
          type: boolean
      type: object
    MissionRequest:
      required:
        - service_id
        - title
        - description
        - city
        - address
        - price
        - initial_hours
        - date_start
      properties:
        service_id:
          type: integer
        title:
          type: string
          maxLength: 255
        description:
          type: string
        city:
          type: string
          maxLength: 50
        address:
          type: string
          maxLength: 255
        skills:
          type: array
          items:
            type: string
          maxItems: 10
        questions:
          type: array
          items:
            type: string
          maxItems: 5
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        price:
          description: 'Budget maximum du client en FCFA.'
          type: number
          minimum: 1
        initial_hours:
          description: 'Nombre d’heures initial défini par le client et non réductible.'
          type: number
          maximum: 999.99
          minimum: 0.5
        date_start:
          type: string
          format: date-time
        date_end:
          type: string
          format: date-time
          nullable: true
      type: object
    MissionUpdateRequest:
      allOf:
        -
          $ref: '#/components/schemas/MissionRequest'
        -
          properties:
            status:
              type: string
              enum:
                - pending
                - in_progress
                - completed
                - cancelled
          type: object
    MissionApplicationRequest:
      required:
        - pricing_type
      properties:
        message:
          type: string
          maxLength: 2000
          nullable: true
        pricing_type:
          type: string
          enum:
            - hourly
            - global
        hourly_rate:
          description: 'Obligatoire lorsque pricing_type vaut hourly.'
          type: number
          maximum: 99999999.99
          minimum: 1
          nullable: true
        proposed_price:
          description: 'Forfait obligatoire lorsque pricing_type vaut global.'
          type: number
          maximum: 99999999.99
          minimum: 1
          nullable: true
      type: object
    MissionApplication:
      properties:
        id:
          type: integer
        mission_id:
          type: integer
        worker_id:
          type: integer
        message:
          type: string
          nullable: true
        pricing_type:
          type: string
          enum:
            - hourly
            - global
        hourly_rate:
          type: number
          nullable: true
        proposed_price:
          type: number
          nullable: true
        status:
          type: string
          enum:
            - en_attente
            - acceptee
            - refusee
      type: object
    MissionApplicationResponse:
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/MissionApplication'
      type: object
    MissionAiRequest:
      required:
        - keywords
      properties:
        keywords:
          type: string
          maxLength: 1000
          minLength: 3
      type: object
    MessageRequest:
      required:
        - receiver_id
        - message
      properties:
        receiver_id:
          type: integer
        mission_id:
          type: integer
          nullable: true
        message:
          type: string
          maxLength: 5000
      type: object
    ReviewRequest:
      required:
        - mission_id
        - rating
      properties:
        mission_id:
          type: integer
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          maxLength: 2000
          nullable: true
      type: object
    ReviewUpdateRequest:
      required:
        - rating
      properties:
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          maxLength: 2000
          nullable: true
      type: object
    TranslationRequest:
      required:
        - text
        - source_locale
        - target_locale
      properties:
        text:
          type: string
          maxLength: 10000
        source_locale:
          type: string
          maxLength: 10
        target_locale:
          type: string
          maxLength: 10
        context:
          type: object
      type: object
    UserSkillRequest:
      required:
        - user_id
        - service_id
        - level
      properties:
        user_id:
          type: integer
        service_id:
          type: integer
        level:
          type: string
          maxLength: 50
      type: object
    PaymentCreateRequest:
      required:
        - method
        - images
      properties:
        method:
          type: string
          enum:
            - orange_money
            - moov_money
            - carte
            - paypal
        images:
          type: array
          items:
            type: string
            format: binary
          maxItems: 5
          minItems: 1
      type: object
    Payment:
      properties:
        id:
          type: integer
        mission_id:
          type: integer
        amount:
          type: number
          format: float
        status:
          type: string
          enum:
            - en_attente
            - effectue
            - echoue
            - annule
        method:
          type: string
          enum:
            - orange_money
            - moov_money
            - carte
            - paypal
        provider:
          type: string
          enum:
            - cinetpay
            - paypal
        paid_at:
          type: string
          format: date-time
          nullable: true
      type: object
    PaymentResponse:
      properties:
        payment:
          $ref: '#/components/schemas/Payment'
        payment_url:
          type: string
          format: uri
          nullable: true
      type: object
    PaginatedResponse:
      properties:
        current_page:
          type: integer
        data:
          type: array
          items:
            type: object
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
      type: object
  responses:
    Unauthenticated:
      description: 'Authentification requise'
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: Unauthenticated.
            type: object
    Forbidden:
      description: 'Action interdite'
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
            type: object
    NotFound:
      description: 'Ressource introuvable'
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
            type: object
    ValidationError:
      description: 'Erreur de validation'
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  schema: Schemas
                  type: array
                  items:
                    type: string
            type: object
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  securitySchemes:
    sanctum:
      type: apiKey
      description: 'Session web Laravel Sanctum. Le nom exact du cookie varie selon l’environnement.'
      name: BaraSira_session
      in: cookie
    bearerAuth:
      type: http
      description: 'Jeton personnel retourné à un client natif lorsque device_name est fourni à la connexion ou à l’inscription.'
      bearerFormat: Sanctum
      scheme: bearer
